name: Build Nickets

on:
  push:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build Go server binary
        working-directory: launcher-go
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: '0'
        run: go build -ldflags="-s -w -H windowsgui" -o nickets-server.exe main.go

      - name: Install Electron dependencies
        working-directory: electron
        run: npm install

      - name: Build Electron installer
        working-directory: electron
        run: npx electron-builder --win --x64 --publish never

      - name: List build output
        run: dir electron\dist\
        shell: cmd

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.0-${{ github.run_number }}
          name: Nickets v2.0.0 Build ${{ github.run_number }}
          files: |
            electron/dist/NicketsSetup.exe
          make_latest: true
